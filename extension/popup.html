<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IrfanLLM Controller</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            width: 290px;
            background: #090d16;
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 14px;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid rgba(56, 189, 248, 0.2);
            padding-bottom: 10px;
            margin-bottom: 12px;
        }
        .header img {
            width: 32px;
            height: 32px;
            border-radius: 6px;
        }
        .header h1 {
            font-size: 0.95rem;
            color: #38bdf8;
            font-weight: 800;
            line-height: 1.2;
        }
        .header p {
            font-size: 0.72rem;
            color: #94a3b8;
        }
        .btn-launch {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: #fff;
            border: 1px solid #38bdf8;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.88rem;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
            margin-bottom: 12px;
        }
        .btn-launch:hover {
            background: linear-gradient(135deg, #0369a1, #0284c7);
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
        }
        .guide-box {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 12px;
            font-size: 0.78rem;
            line-height: 1.45;
        }
        .guide-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }
        .guide-item:last-child { margin-bottom: 0; }
        .guide-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .footer-links {
            display: flex;
            justify-content: space-between;
            font-size: 0.72rem;
        }
        .footer-links a {
            color: #38bdf8;
            text-decoration: none;
        }
        .footer-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="header">
        <img src="icon.png" alt="IrfanLLM Icon">
        <div>
            <h1>IrfanLLM Manga</h1>
            <p>Zero-Touch AI Reader</p>
        </div>
    </div>

    <button id="btn-toggle" class="btn-launch">
        📷 Toggle Controller On Tab
    </button>

    <div class="guide-box">
        <div class="guide-item">
            <span class="guide-dot" style="background:#38bdf8;"></span>
            <span><strong>Right Hand:</strong> Curled fist &rarr; Scroll Down</span>
        </div>
        <div class="guide-item">
            <span class="guide-dot" style="background:#c084fc;"></span>
            <span><strong>Left Hand:</strong> Under chin &rarr; Scroll Up</span>
        </div>
        <div class="guide-item">
            <span class="guide-dot" style="background:#34d399;"></span>
            <span><strong>No Hand:</strong> Lower arms &rarr; Stationary</span>
        </div>
        <div class="guide-item">
            <span class="guide-dot" style="background:#fbbf24;"></span>
            <span><strong>Swipe Flick:</strong> Swift vertical flick &rarr; Momentum glide</span>
        </div>
    </div>

    <div class="footer-links">
        <a href="https://demonicscans.org" target="_blank">Open DemonicScans &rarr;</a>
        <a href="https://irfanfahmi.com" target="_blank">irfanfahmi.com</a>
    </div>

    <script src="popup.js"></script>
</body>
</html>
