      end_date: 2022-05
    - institution: Kolej Komuniti Selandar
      area: Certificate in Computer Systems and Networking
      start_date: 2017-07
      end_date: 2019-02
    Technical Skills:
    - label: Programming & data
      details: Python, C/C++, JavaScript, TypeScript, SQL, MySQL, Git.
    - label: Intelligent systems
      details: YOLOv8, OpenCV, MediaPipe, Random Forest, LLM orchestration.
    - label: Hardware & systems
      details: Arduino, HX711, load cells, sensor integration, Android investigation, Windows troubleshooting,
        VLAN, OSPF, Wireshark.
    Selected Projects:
    - name: '[Hybrid Self-Checkout](https://irfanfahmi.com/projects/checkout/)'
      highlights:
      - Built a Python pipeline combining YOLOv8/OpenCV product detection, USB barcode input and MySQL
        product/transaction data.
      - 'Repository-reported evaluation: 77.4% precision and 72.0% recall after 50 epochs; tested visual verification
        challenges including occlusion and similar packaging.'
    - name: '[SMC Crows / Android Release Engineering](https://irfanfahmi.com/projects/smc-crows/)'
      highlights:
      - Worked on Android compatibility investigation, release packaging, device testing and a community
        distribution portal.
      - Documented installation and account backup/recovery workflows; release-specific test records explain
        device and Android-version constraints.
    - name: '[IoT Livestock Weight Tracking](https://irfanfahmi.com/projects/livestock/)'
      highlights:
      - Contributed to a team weighing/monitoring platform using Arduino, HX711 load-cell amplifiers, C/C++
        signal filtering and telemetry dashboards.
      - Team awarded Third Place at INOTEK 2025 (Series 1), 15 January 2025, for Development of Livestock
        Weight Tracking System Based on IoT.
    Technical Experience:
    - company: Global Elite Ventures Sdn. Bhd
