    Selected Projects:
    - name: '[Hybrid Self Checkout](https://irfanfahmi.com/projects/checkout/)'
      summary: Built a Python pipeline combining YOLOv8 and OpenCV product detection USB barcode input and
        MySQL product and transaction data. Repository reported evaluation 77.4 percent precision and 72.0
        percent recall after 50 epochs. Tested visual verification challenges including occlusion and similar
        packaging.
    - name: '[SMC Crows and Android Release Engineering](https://irfanfahmi.com/projects/smc-crows/)'
      summary: Contributed to the SMC Crows community through Android compatibility investigation release
        packaging device testing and installation and account recovery guidance. Community distribution
        recorded 29594 download requests across all release and setup versions as of 22 October 2026. Counts
        include retries.
    - name: '[IoT Livestock Weight Tracking](https://irfanfahmi.com/projects/livestock/)'
      summary: Contributed to a team weighing and monitoring platform using Arduino HX711 load cell amplifiers
        C and C++ signal filtering and telemetry dashboards. Team awarded Third Place at INOTEK 2025 Series 1
        15 January 2025 for Development of Livestock Weight Tracking System Based on IoT.
