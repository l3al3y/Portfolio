    Technical Skills:
    - label: Application development
      details: JavaScript, TypeScript, React, Tailwind CSS, Python, browser events and application state.
    - label: Data & tooling
      details: SQL, MySQL, Git/GitHub, Cloudflare, release packaging and technical documentation.
    - label: Systems practice
      details: Android compatibility investigation, device testing, installation/recovery workflows,
        hardware/software troubleshooting.
    Selected Projects:
    - name: '[SMC Crows / Android Release Engineering](https://irfanfahmi.com/projects/smc-crows/)'
      highlights:
      - Worked on Android compatibility investigation, release packaging, device testing and a community
        distribution portal.
      - Documented installation and account backup/recovery workflows; release-specific test records explain
        device and Android-version constraints.
    - name: '[Mini Arcade / Interactive Web Applications](https://irfanfahmi.com/projects/arcade/)'
      highlights:
      - Built a React/TypeScript arcade with minimax-based Tic Tac Toe, penalty-shootout and memory-game
        interactions, styled with Tailwind CSS.
      - Explored game-state transitions, decision logic and touch/desktop interaction through a publicly
        accessible browser application.
    - name: '[Gesture Recognition / Touchless Reader](https://irfanfahmi.com/projects/gesture/)'
      highlights:
      - Converted MediaPipe hand landmarks into 71-dimensional features and a 100-tree Random Forest for
        browser inference in JavaScript.
      - Implemented gesture navigation with cooldowns and virtual controls. Reported 98.6% cross-validation
        accuracy; not a real-world user accuracy measurement.
