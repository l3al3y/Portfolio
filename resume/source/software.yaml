    Professional Summary:
    - Computer Engineering background at UTeM with project experience across React and TypeScript interfaces
      JavaScript browser interactions Python integrations and Android release workflows. Brings technical
      troubleshooting experience and an interest in reliable understandable software.
    Education:
    - institution: Universiti Teknikal Malaysia Melaka UTeM
      area: Bachelor of Computer Engineering with Honours
      start_date: 2022-10
      end_date: 2026-11
      summary: Graduation scheduled for 2 November 2026.
    - institution: Politeknik Port Dickson
      area: Diploma in Electronic Engineering Computer
      start_date: 2018-12
      end_date: 2022-05
    - institution: Kolej Komuniti Selandar
      area: Certificate in Computer Systems and Networking
      start_date: 2017-07
      end_date: 2019-02
    Technical Skills:
    - label: Application development
      details: JavaScript TypeScript React Tailwind CSS Python browser events and application state.
    - label: Data and tooling
      details: SQL MySQL Git and GitHub Cloudflare release packaging and technical documentation.
    - label: Systems practice
      details: Android compatibility investigation device testing installation and recovery workflows hardware
        and software troubleshooting.
    Selected Projects:
    - name: '[SMC Crows and Android Release Engineering](https://irfanfahmi.com/projects/smc-crows/)'
      summary: Contributed to the SMC Crows community through Android compatibility investigation release
        packaging device testing and installation and account recovery guidance. Community distribution
        recorded 29594 download requests across all release and setup versions as of 22 October 2026. Counts
        include retries.
    - name: '[Mini Arcade and Interactive Web Applications](https://irfanfahmi.com/projects/arcade/)'
      summary: Built a React and TypeScript arcade with minimax based Tic Tac Toe penalty shootout and memory
        game interactions styled with Tailwind CSS. Explored game state transitions decision logic and touch
        and desktop interaction through a publicly accessible browser application.
    - name: '[Gesture Recognition and Touchless Reader](https://irfanfahmi.com/projects/gesture/)'
      summary: Converted MediaPipe hand landmarks into 71 dimensional features and a 100 tree Random Forest
        for browser inference in JavaScript. Implemented gesture navigation with cooldowns and virtual
        controls. Reported 98.6 percent cross validation accuracy. Not a real world user accuracy measurement.
    Technical Experience:
    - company: Global Elite Ventures Sdn. Bhd
      position: Technical Staff
      start_date: 2021-09
      end_date: 2022-07
      summary: Technical troubleshooting and hardware and software deployment.
    - company: ARNN Technologies and Karar Solution
      position: Contract Assistant Engineer
      start_date: 2020-06
      end_date: 2020-07
      summary: Engineering project support and technical problem solving.
    - company: OKCS Seri Kembangan
      position: Technician
      start_date: 2018-06
      end_date: 2018-11
      summary: Diagnostics repairs hardware maintenance and software configuration.
    Professional Registrations:
    - label: BEM
      details: Graduate Engineer Computer branch. Approved 15 October 2026. [Public
        directory](https://engineer.org.my/public/Engineers/Index/325542).
    - label: MBOT
      details: Graduate Technologist Information and Communication Technology IT. GT26100872. Approved 22
        October 2026.
    Selected Training:
    - label: Festo and STDC
      details: Industrial Automation with AI in Manufacturing 14 to 16 July 2026.
    - label: Cisco Networking Academy
      details: Enterprise Networking Security and Automation. Switching Routing and Wireless Essentials 23
        February 2026. Course completions.
    Languages:
    - Bahasa Malaysia native. English professional working proficiency.
