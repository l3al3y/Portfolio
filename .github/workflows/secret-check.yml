name: Check public repository credentials

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Scan committed files and archives
        run: python3 scripts/check_secrets.py
      - name: Test detection and redaction
        run: python3 -m unittest discover -s tests -p test_secret_guard.py
